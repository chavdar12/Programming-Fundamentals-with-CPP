name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      - uses: lukka/get-cmake@latest

      # Pull requests: fail if unformatted. Pushes: format and commit.
      - name: Check formatting (PR)
        if: github.event_name == 'pull_request'
        run: |
          find . -path ./build -prune -o \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run -Werror

      - name: Apply formatting (push)
        if: github.event_name == 'push'
        run: |
          find . -path ./build -prune -o \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format -i
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: apply clang-format"
            git push
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Lint (clang-tidy)
        continue-on-error: true
        run: |
          find . -path ./build -prune -o -name '*.cpp' -print0 \
            | xargs -0 -n1 -P4 clang-tidy -p build --quiet \
                --checks='-*,clang-analyzer-*,bugprone-*,performance-*' \
                --header-filter='^$' 2>/dev/null || true

      - name: Build
        run: cmake --build build -j

      - name: Test
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure