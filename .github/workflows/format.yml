name: Format and Lint (MSVC)

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  format-lint:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Format (clang-format, Microsoft style)
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Include *.c,*.cc,*.cpp,*.cxx,*.h,*.hpp |
            Where-Object { $_.FullName -notmatch '\\(\.git|build|x64|x86|Debug|Release|packages)\\' } |
            ForEach-Object {
              clang-format -i -style=Microsoft $_.FullName
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not format $($_.Name)" }
            }
          exit 0

      - name: Commit formatted code
        if: github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "style: apply clang-format (Microsoft)"
            git push
          }
          exit 0

      - uses: microsoft/setup-msbuild@v2
        continue-on-error: true

      - name: Lint (MSVC Code Analysis, Microsoft Native Recommended Rules)
        continue-on-error: true
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $sln) { Write-Warning "No .sln found"; exit 0 }
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 `
            /p:RunCodeAnalysis=true `
            /p:CodeAnalysisRuleSet=MicrosoftNativeRecommendedRules.ruleset `
            /p:CodeAnalysisTreatWarningsAsErrors=false `
            /p:TreatWarningsAsErrors=false
          exit 0
